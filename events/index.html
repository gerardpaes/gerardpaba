<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find a Date - Gerard Paba Estampa</title>
<link rel="icon" type="image/png" href="/gpe-logo.png">
<script defer src="https://cloud.umami.is/script.js" data-website-id="eff1178a-d95e-49c5-92b3-550625da8bc9"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/events/style.css">
<script src="/events/gate.js"></script>
</head>
<body>

<header>
  <div class="nav">
    <span class="brand">📅 Find a Date</span>
    <div class="nav-links">
      <a href="/" class="back-link" data-i18n="back_to_site">Back to site</a>
      <div class="lang-switcher" id="lang-switcher"></div>
    </div>
  </div>
</header>

<section class="upcoming-section" style="padding-top: 130px;">
  <h2 data-i18n="upcoming_title">Pròxims esdeveniments</h2>
  <p class="section-sub" data-i18n="upcoming_sub">Confirmed events with a date.</p>
  <div class="upcoming-grid" id="upcoming-grid">
    <div class="empty-state" data-i18n="loading_events">Loading…</div>
  </div>
</section>

<div class="create-trigger-row">
  <button class="create-fab-btn" id="open-create-modal" type="button">
    <span class="plus-icon">+</span>
    <span data-i18n="btn_create_event">Create an event</span>
  </button>
</div>

<section id="events">
  <h2 data-i18n="voting_title">En votació</h2>
  <p class="section-sub" data-i18n="events_sub">Open an event…</p>

  <div class="event-list" id="event-list">
    <div class="empty-state" data-i18n="loading_events">Loading events...</div>
  </div>
</section>

<footer class="hint" data-i18n="footer_hint">Data syncs live via Firebase.</footer>

<!-- Create event modal -->
<div class="create-modal-overlay" id="create-modal-overlay">
  <div class="create-modal" style="position:relative;">
    <button class="modal-close-btn" id="close-create-modal" type="button">&times;</button>
    <h2 data-i18n="create_title">Create a new event</h2>
    <p class="section-sub" data-i18n="create_sub">Give it a name…</p>

    <label class="field-label" for="event-name" data-i18n="label_event_name">Event name</label>
    <input type="text" id="event-name" data-i18n-placeholder="placeholder_event_name" placeholder="e.g. Christmas Dinner">

    <div class="emoji-picker-row">
      <label class="field-label" data-i18n="label_choose_emoji">Choose an icon (optional)</label>
      <div class="emoji-picker-grid" id="emoji-picker-grid"></div>
      <input type="text" id="emoji-free-input" class="emoji-free-input" maxlength="4" placeholder="😀" inputmode="text" autocomplete="off">
    </div>

    <div class="confirmed-toggle-row">
      <input type="checkbox" id="confirmed-date-toggle">
      <label for="confirmed-date-toggle" style="margin:0; font-weight:500; cursor:pointer;" data-i18n="label_confirmed_date_toggle">I already have a confirmed date</label>
    </div>

    <div class="confirmed-fields" id="confirmed-fields">
      <div>
        <label class="field-label" data-i18n="label_date">Date</label>
        <input type="date" id="confirmed-date-input">
      </div>
      <div>
        <label class="field-label" data-i18n="label_time_optional">Time</label>
        <input type="time" id="confirmed-time-input">
      </div>
      <div>
        <label class="field-label" data-i18n="label_location_optional">Location</label>
        <input type="text" id="confirmed-location-input" data-i18n-placeholder="placeholder_location">
      </div>
    </div>

    <div class="btn-row" style="margin-top:10px;">
      <button class="btn block" id="create-event-btn" type="button" data-i18n="btn_create">Create event</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/events/calendar.js"></script>
<script type="module" src="/events/home.js"></script>
</body>
</html>
