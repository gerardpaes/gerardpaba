<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find a Date - Gerard Paba Estampa</title>
<link rel="icon" type="image/png" href="/gpe-logo.png">
<script defer src="https://cloud.umami.is/script.js" data-website-id="eff1178a-d95e-49c5-92b3-550625da8bc9"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="gate.js"></script>
</head>
<body>

<header>
  <div class="nav">
    <span class="brand">📅 Find a Date</span>
    <div class="nav-links">
      <a href="#create" class="nav-link" data-i18n="nav_new_event">New event</a>
      <a href="#events" class="nav-link" data-i18n="nav_events">Events</a>
      <a href="/" class="back-link" data-i18n="back_to_site">Back to site</a>
      <div class="lang-switcher" id="lang-switcher"></div>
    </div>
  </div>
</header>

<section class="hero">
  <h1 data-i18n="hero_title">Plan your next get-together</h1>
  <p class="intro" data-i18n="hero_intro">Create an event…</p>
  <div class="hero-buttons">
    <a href="#create" class="btn" data-i18n="btn_create_event">Create an event</a>
    <a href="#events" class="btn secondary" data-i18n="btn_see_events">See existing events</a>
  </div>
</section>

<section id="create">
  <h2 data-i18n="create_title">Create a new event</h2>
  <p class="section-sub" data-i18n="create_sub">Give it a name…</p>

  <div class="card">
    <label class="field-label" for="event-name" data-i18n="label_event_name">Event name</label>
    <input type="text" id="event-name" data-i18n-placeholder="placeholder_event_name" placeholder="e.g. Christmas Dinner">

    <label class="field-label" style="margin-top:10px;" data-i18n="label_pick_dates">Candidate dates</label>
    <div class="calendar" id="create-calendar"></div>

    <div class="btn-row" style="margin-top:24px;">
      <button class="btn" id="create-event-btn" type="button" data-i18n="btn_create">Create event</button>
    </div>
  </div>
</section>

<section id="events">
  <h2 data-i18n="events_title">Existing events</h2>
  <p class="section-sub" data-i18n="events_sub">Open an event…</p>

  <div class="dashboard-filters" id="dashboard-filters"></div>

  <div class="event-list" id="event-list">
    <div class="empty-state" data-i18n="loading_events">Loading events...</div>
  </div>
</section>

<footer class="hint" data-i18n="footer_hint">Data syncs live via Firebase.</footer>

<div class="toast" id="toast"></div>

<script type="module" src="calendar.js"></script>
<script type="module" src="home.js"></script>
</body>
</html>
